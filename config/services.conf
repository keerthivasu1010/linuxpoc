# Process Supervisor (Mini "init") - ADAS ECU Supervisor
# Format: name : path : args(comma-separated) : auto_restart(0/1) : max_restarts(-1=inf) : backoff_sec
#
# Replace these paths with the real ADAS service binaries when deployed.
lane_detect   : /opt/adas/bin/lane_detect   :             : 1 : 5  : 2
obj_detect    : /opt/adas/bin/obj_detect    : --mode=fast : 1 : 5  : 2
sensor_fusion : /opt/adas/bin/sensor_fusion :             : 1 : -1 : 3
can_gateway   : /opt/adas/bin/can_gateway   : --bus=can0  : 1 : 3  : 5
telemetry_log : /opt/adas/bin/telemetry_log :             : 0 : 0  : 0
